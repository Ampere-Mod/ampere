modLoader = "javafml" #mandatory

loaderVersion = "${loader_version_range}" #mandatory

license = "${mod_license}"

issueTrackerURL="https://github.com/Ampere-Mod/ampere/issues/" #optional

[[mods]] #mandatory

modId = "${mod_id}" #mandatory

version = "${mod_version}" #mandatory

displayName = "${mod_name}" #mandatory

updateJSONURL="https://github.com/Ampere-Mod/ampere/blob/21.1/core/update.json" #optional

displayURL="https://ampere.gtlugo.com/" #optional

logoFile="logo_large.png" #optional

#credits="" #optional

authors = "GTLugo"

description = '''
Create power grids to electrify your world.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${ mod_id }]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[${neo_version},)" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "${api_id}"
type = "required"
versionRange = "[${api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId="cb_multipart"
type="required"   # or "optional" if multipart support is a soft feature
versionRange="[${cb_multipart_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${ mod_id }]]
modId="codechickenlib"
type="required"
versionRange="[${code_chicken_lib_version},)"
ordering="AFTER"
side="BOTH"

#[features.${mod_id}]
#openGLVersion="[3.2,)"
