modLoader = "javafml" #mandatory

loaderVersion = "${loader_version_range}" #mandatory

license = "${api_license}"

issueTrackerURL="https://github.com/Ampere-Mod/ampere/issues/" #optional

[[mods]] #mandatory

modId = "${api_id}" #mandatory

version = "${api_version}" #mandatory

displayName = "${api_name}" #mandatory

updateJSONURL="https://github.com/Ampere-Mod/ampere/blob/21.1/api/update.json" #optional

displayURL="https://ampere.gtlugo.com/" #optional

logoFile="logo_large.png" #optional

#credits="" #optional

authors = "GTLugo"

description = '''
Create power grids to electrify your world.
'''

[[mixins]]
config = "${api_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${ api_id }]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[${neo_version},)" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies.${ api_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

